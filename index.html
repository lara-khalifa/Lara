<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Premium Content Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-black to-gray-900 text-white">

<!-- HEADER -->
<div class="p-4 flex justify-between items-center border-b border-gray-800">
  <h1 class="text-xl font-bold">🔥 Premium Hub</h1>
  <button onclick="openLogin()" class="bg-blue-600 px-4 py-2 rounded-lg">
    إنشاء حساب
  </button>
</div>

<!-- HERO -->
<div class="text-center mt-10">
  <h2 class="text-3xl font-bold">محتوى حصري للمشتركين فقط</h2>
  <p class="text-gray-400 mt-2">اشترك للوصول إلى كل المحتوى المميز</p>

  <button onclick="openSubscribe()"
    class="mt-6 bg-green-500 px-6 py-3 rounded-xl text-lg shadow-lg">
    🔓 اشترك الآن
  </button>
</div>

<!-- CONTENT GRID -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-6 mt-10">

  <div class="bg-gray-800 p-4 rounded-xl shadow-lg">
    <h3 class="font-bold">🎥 فيديو تعليمي</h3>
    <p class="text-gray-400 text-sm">محتوى مقفل للمشتركين</p>
    <div class="mt-3 bg-black p-6 rounded blur-sm text-center">
      🔒 Locked
    </div>
  </div>

  <div class="bg-gray-800 p-4 rounded-xl shadow-lg">
    <h3 class="font-bold">📸 صور حصرية</h3>
    <p class="text-gray-400 text-sm">معرض خاص</p>
    <div class="mt-3 bg-black p-6 rounded blur-sm text-center">
      🔒 Locked
    </div>
  </div>

  <div class="bg-gray-800 p-4 rounded-xl shadow-lg">
    <h3 class="font-bold">📚 محتوى مميز</h3>
    <p class="text-gray-400 text-sm">دروس و ملفات خاصة</p>
    <div class="mt-3 bg-black p-6 rounded blur-sm text-center">
      🔒 Locked
    </div>
  </div>

</div>

<!-- LOGIN MODAL -->
<div id="login" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center">
  <div class="bg-gray-900 p-6 rounded-xl w-96">

    <h2 class="text-xl mb-4">إنشاء حساب</h2>

    <input placeholder="اسم المستخدم"
      class="w-full p-2 mb-2 text-black rounded">

    <input type="password" placeholder="كلمة المرور"
      class="w-full p-2 mb-4 text-black rounded">

    <button onclick="fakeLogin()"
      class="bg-blue-600 w-full p-2 rounded">
      إنشاء حساب
    </button>

    <button onclick="closeLogin()" class="mt-3 text-sm text-gray-400">
      إغلاق
    </button>
  </div>
</div>

<!-- SUBSCRIBE MODAL -->
<div id="subscribe" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center">
  <div class="bg-gray-900 p-6 rounded-xl w-96">

    <h2 class="text-xl mb-4">💳 الاشتراك</h2>

    <div class="bg-black p-3 rounded mb-3 text-sm">
      <p>BaridiMob: 00799999004286372491</p>
      <p>Binance ID: 1202030004</p>
    </div>

    <p class="text-sm mb-2">رفع إثبات الدفع:</p>
    <input type="file" class="mb-4">

    <button onclick="unlockContent()"
      class="bg-green-600 w-full p-2 rounded">
      طلب تفعيل
    </button>

    <button onclick="closeSubscribe()" class="mt-3 text-sm text-gray-400">
      إغلاق
    </button>

  </div>
</div>

<script>
function openLogin(){
  document.getElementById("login").style.display="flex";
}
function closeLogin(){
  document.getElementById("login").style.display="none";
}
function fakeLogin(){
  alert("تم إنشاء الحساب (وهمي)");
  closeLogin();
}

function openSubscribe(){
  document.getElementById("subscribe").style.display="flex";
}
function closeSubscribe(){
  document.getElementById("subscribe").style.display="none";
}

function unlockContent(){
  alert("تم إرسال طلبك وسيتم التفعيل قريبًا");

  document.querySelectorAll(".blur").forEach(el=>{
    el.classList.remove("blur-sm");
  });
}
</script>

</body>
</html>
