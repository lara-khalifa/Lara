<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LARA KHALIFA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.container { padding: 20px; }

button {
  padding: 10px 15px;
  margin: 10px;
  border: none;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.card {
  background: white;
  color: black;
  margin: 10px auto;
  padding: 15px;
  width: 80%;
  max-width: 300px;
  border-radius: 10px;
}

.slider img {
  width: 90%;
  max-width: 500px;
  height: 280px;
  object-fit: cover;
  border-radius: 12px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const images = [
  "https://i.postimg.cc/gktS9jxh/images-8.jpg",
  "https://i.postimg.cc/zX2tmvLZ/images-6.jpg",
  "https://i.postimg.cc/kgXmsBk1/images-10.jpg",
  "https://i.postimg.cc/kGn1CtN8/images-9.jpg"
];

let page = "welcome";
let index = 0;

function render() {
  const app = document.getElementById("app");

  if (page === "welcome") {
    app.innerHTML = `
      <div class="container">
        <h1>LARA KHALIFA</h1>
        <p>مرحبا بك</p>
        <button onclick="goHome()">الدخول</button>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <div class="container">
      <h1>العروض</h1>

      <div class="slider">
        <img id="img" src="${images[index]}">
      </div>

      <div class="card">
        <h3>6 أشهر - 150€</h3>
        <button onclick="buy('6 أشهر')">اشترك</button>
      </div>

      <div class="card">
        <h3>VIP - 250€</h3>
        <button onclick="buy('VIP')">اشترك</button>
      </div>

      <div class="card">
        <h3>سنوي - 300€</h3>
        <button onclick="buy('سنوي')">اشترك</button>
      </div>
    </div>
  `;
}

function goHome() {
  page = "home";
  render();
}

function buy(plan) {
  let method = prompt("baridi / binance / paypal");
  alert("الخطة: " + plan + "\nالدفع: " + method);
}

setInterval(() => {
  if (page === "home") {
    index = (index + 1) % images.length;
    const img = document.getElementById("img");
    if (img) img.src = images[index];
  }
}, 2500);

render();
</script>

</body>
</html>
