<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>LARA KHALIFA</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
  text-align: center;
}

header {
  padding: 60px 20px;
}

h1 {
  font-size: 40px;
}

button {
  padding: 12px 20px;
  background: #e91e63;
  border: none;
  color: white;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

.page {
  display: none;
  padding: 20px;
}

.card {
  background: #222;
  margin: 10px;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header id="home">
  <h1>LARA KHALIFA</h1>
  <p>مرحباً بك في المنصة الحصرية</p>
  <button onclick="showPage('plans')">الدخول إلى العروض</button>
</header>

<div id="plans" class="page">
  <h2>خطط الاشتراك</h2>

  <div class="card">6 أشهر عادي - 150€</div>
  <div class="card">6 أشهر VIP - 250€</div>
  <div class="card">اشتراك سنوي - 300€</div>

  <button onclick="showPage('profile')">اختيار</button>
</div>

<div id="profile" class="page">
  <h2>الملف الشخصي</h2>

  <div class="card">👤 عدد المشتركين: 1200</div>
  <div class="card">⭐ الحالة: غير مفعل</div>

  <div class="card" style="filter: blur(5px);">
    🔒 محتوى خاص (مقفل)
  </div>
</div>

<script>
function showPage(page) {
  document.getElementById("home").style.display = "none";
  document.getElementById("plans").style.display = "none";
  document.getElementById("profile").style.display = "none";

  document.getElementById(page).style.display = "block";
}
</script>

</body>
</html>
