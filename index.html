<title>LARA KHALIFA</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle, #111, #000);
  color: white;
  text-align: center;
}

/* HEADER */
header {
  padding: 50px 20px;
}

h1 {
  font-size: 60px;
  margin-bottom: 10px;
}

p {
  font-size: 20px;
  color: #ccc;
}

/* BUTTON */
button {
  padding: 15px 30px;
  background: linear-gradient(45deg, #e91e63, #ff5722);
  border: none;
  color: white;
  border-radius: 12px;
  font-size: 20px;
  cursor: pointer;
  margin-top: 20px;
}

/* PAGES */
.page {
  display: none;
  padding: 30px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.05);
  margin: 15px auto;
  padding: 20px;
  border-radius: 15px;
  width: 80%;
  max-width: 500px;
  font-size: 22px;
}

/* ===== SLIDER ===== */
.slider {
  width: 80%;
  max-width: 500px;
  margin: auto;
  overflow: hidden;
  border-radius: 20px;
  box-shadow: 0 0 25px rgba(255,255,255,0.2);
}

.slides {
  display: flex;
  width: 400%;
  animation: slide 12s infinite;
}

.slides img {
  width: 100%;
  border-radius: 20px;
}
