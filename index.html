<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LARA KHALIFA</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
direction:rtl;
}

.page{display:none;padding:20px;}
.active{display:block;}

.header{
background:#111;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.btn{
display:block;
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:#111;
color:white;
font-size:16px;
}

.card{
background:white;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="home" class="page active">
<div class="header">LARA KHALIFA</div>

<div class="card">
<h3>مرحباً بك 👋</h3>
<p>اضغط للانتقال إلى الاشتراك ومشاهدة المحتوى الحصري</p>
<button class="btn" onclick="go('plans')">الإشتراك الآن</button>
</div>
</div>

<!-- PAGE 2 -->
<div id="plans" class="page">
<div class="header">عروض الاشتراك</div>

<div class="card">
<h3>اشتراك 6 أشهر عادي</h3>
<p>150€</p>
<button class="btn" onclick="selectPlan('6 أشهر - عادي - 150€')">اشتراك</button>
</div>

<div class="card">
<h3>اشتراك 6 أشهر VIP</h3>
<p>250€</p>
<button class="btn" onclick="selectPlan('6 أشهر - VIP - 250€')">اشتراك</button>
</div>

<div class="card">
<h3>اشتراك سنوي</h3>
<p>300€</p>
<button class="btn" onclick="selectPlan('سنوي - 300€')">اشتراك</button>
</div>
</div>

<!-- PAGE 3 -->
<div id="pay" class="page">
<div class="header">طريقة الدفع</div>

<div class="card">
<p id="selectedPlan"></p>

<select id="method">
<option>Binance</option>
<option>BaridiMob</option>
<option>PayPal (QR)</option>
</select>

<button class="btn" onclick="go('upload')">تأكيد الدفع</button>
</div>
</div>

<!-- PAGE 4 -->
<div id="upload" class="page">
<div class="header">رفع وصل الدفع</div>

<div class="card">
<p>ارفع صورة الوصل</p>
<input type="file">

<input type="text" placeholder="رقم العملية / ID">

<button class="btn" onclick="confirmPay()">إرسال</button>
</div>
</div>

<!-- PAGE 5 -->
<div id="done" class="page">
<div class="header">تم الطلب</div>

<div class="card">
<h3>تم استلام طلبك ✅</h3>
<p>سيتم مراجعة الدفع وتأكيد الاشتراك قريباً</p>
</div>
</div>

<script>
let plan="";

function go(page){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(page).classList.add('active');
}

function selectPlan(p){
plan=p;
document.getElementById("selectedPlan").innerText="الخطة المختارة: "+p;
go('pay');
}

function confirmPay(){
if(document.querySelector("input[type=file]").files.length===0){
alert("ارفع الوصل أولاً");
return;
}
go('done');
}
</script>

</body>
</html>
