<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LARA KHALIFA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  text-align: center;
  background: #000;
}

.bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background-size: cover;
  background-position: center;
  filter: brightness(0.4);
}

.container {
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.9);
  color: black;
  margin: 10px auto;
  padding: 15px;
  width: 85%;
  max-width: 320px;
  border-radius: 10px;
}

button {
  padding: 10px 15px;
  margin: 10px;
  border: none;
  background: black;
  color: white;
  border-radius: 8px;
}

input {
  padding: 10px;
  margin: 10px;
  width: 80%;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div id="app"></div>

<script>
const images = [
  "https://i.postimg.cc/gktS9jxh/images-8.jpg",
  "https://i.postimg.cc/zX2tmvLZ/images-6.jpg",
  "https://i.postimg.cc/kgXmsBk1/images-10.jpg",
  "https://i.postimg.cc/kGn1CtN8/images-9.jpg"
];

let i = 0;
let page = "home";
let selectedPlan = "";
let receipt = "";

function setBG() {
  document.getElementById("bg").style.backgroundImage =
    "url(" + images[i] + ")";
}

setInterval(() => {
  i = (i + 1) % images.length;
  setBG();
}, 3000);

function render() {
  setBG();
  const app = document.getElementById("app");

  if (page === "home") {
    app.innerHTML = `
      <div class="container">
        <h1>LARA KHALIFA</h1>

        <div class="card">
          <h3>ستة أشهر</h3>
          <p>150€</p>
          <button onclick="openPay('ستة أشهر - 150€')">اشتراك</button>
        </div>

        <div class="card">
          <h3>VIP</h3>
          <p>250€</p>
          <button onclick="openPay('VIP - 250€')">اشتراك</button>
        </div>

        <div class="card">
          <h3>سنوي</h3>
          <p>300€</p>
          <button onclick="openPay('سنوي - 300€')">اشتراك</button>
        </div>
      </div>
    `;
  }

  if (page === "pay") {
    app.innerHTML = `
      <div class="container">
        <h2>الدفع</h2>
        <p>${selectedPlan}</p>

        <button onclick="payMethod('baridi')">BaridiMob</button>
        <button onclick="payMethod('binance')">Binance</button>

        <br>

        <input type="file" onchange="upload(event)" />

        <br>

        <button onclick="confirmPay()">تأكيد الدفع</button>
        <button onclick="goHome()">رجوع</button>
      </div>
    `;
  }

  if (page === "done") {
    app.innerHTML = `
      <div class="container">
        <h2>تم استلام طلبك ✅</h2>
      </div>
    `;
  }
}
