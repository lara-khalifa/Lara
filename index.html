<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LARA KHALIFA</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

.container{
max-width:500px;
margin:auto;
padding:15px;
}

.header{
text-align:center;
font-size:24px;
font-weight:bold;
padding:20px;
}

.slider{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
gap:10px;
padding:10px 0;
}

.slide{
min-width:100%;
height:180px;
background:#222;
border-radius:15px;
scroll-snap-align:center;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
}

.card{
background:#1c1c1c;
padding:15px;
margin:10px 0;
border-radius:12px;
}

.btn{
display:block;
text-align:center;
padding:12px;
margin-top:10px;
background:white;
color:black;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

.price{
font-size:18px;
margin:5px 0;
color:#00ffcc;
}

input, select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
}

section{
margin-top:20px;
}

small{
color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<div class="header">LARA KHALIFA</div>

<!-- SLIDER -->
<div class="slider">
<div class="slide">صورة 1</div>
<div class="slide">صورة 2</div>
<div class="slide">صورة 3</div>
</div>

<!-- WELCOME -->
